[package]
name = "couchcordd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "couchcord daemon: doctor de-risk gate + the composition-root reactor"

[dependencies]
cc-core = { path = "../cc-core" }
cc-menu = { path = "../cc-menu" }
cc-config = { path = "../cc-config" }
anyhow = "1"
evdev = "0.12"
x11rb = "0.13"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
futures-util = "0.3"
